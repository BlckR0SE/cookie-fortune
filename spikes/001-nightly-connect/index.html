<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spike 001 — Nightly ↔ Cookie Chain round-trip</title>
<style>
  body { font-family: monospace; background: #14121a; color: #d8d4e0; margin: 2rem; max-width: 860px; }
  h1 { font-size: 1.1rem; color: #ffb347; }
  button { font: inherit; padding: .4rem 1rem; margin: .25rem .5rem .25rem 0; background: #ffb347; border: 0; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  pre { background: #1d1a26; border: 1px solid #3a3448; border-radius: 6px; padding: .75rem; white-space: pre-wrap; word-break: break-all; }
  .ok { color: #7dd87d; } .err { color: #ff7d7d; } .warn { color: #ffd27d; }
</style>
</head>
<body>
<h1>Spike 001 — Nightly ↔ Cookie Chain ↔ RPC round-trip</h1>
<p>RPC: https://rpc.cookiescan.io · memo "SPIKE" · 0-lamport self-transfer. Open with Nightly installed (Cookie Chain RPC).</p>
<div>
  <button id="b-detect">1. detect</button>
  <button id="b-connect" disabled>2. connect</button>
  <button id="b-send" disabled>3. sign+send</button>
  <button id="b-verify" disabled>4. verify memo</button>
</div>
<pre id="log">log:
</pre>
<script type="module">
// ponytail: spike is throwaway — CDN import OK here only; app code bundles locally.
import { Connection, PublicKey, SystemProgram, Transaction, TransactionInstruction } from "https://esm.sh/@solana/web3.js@1.98.2";

const RPC = "https://rpc.cookiescan.io";
const MEMO_PID = new PublicKey("MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr"); // SPL Memo v2
const conn = new Connection(RPC, "confirmed");
const log = (msg, cls = "") => {
  document.getElementById("log").textContent += `\n${cls ? `[${cls}] ` : ""}${msg}`;
};
const el = id => document.getElementById(id);

let provider = null;  // window.nightly?.solana (direct — wallet-standard path dead, spike run 1)
let account = null;   // NightlyAccount from features['standard:connect'] (or shimmed from legacy)
let payer = null;     // PublicKey
let signature = null;

// ---- 1. detection -------------------------------------------------------
el("b-detect").onclick = async () => {
  try {
    const wallets = window.getWallets?.() ?? [];
    log(`wallet-standard getWallets(): ${wallets.length} found`);
    const nightly = window.nightly?.solana;
    log(`window.nightly?.solana: ${nightly ? "PRESENT" : "absent"}`, nightly ? "ok" : "err");
    if (!nightly) { log("Nightly not detected — install extension, configure Cookie Chain RPC, reload.", "err"); return; }
    provider = nightly;
    const feats = Object.keys(provider.features ?? {});
    log(`provider.features keys: ${feats.length ? feats.join(", ") : "(none)"}`);
    // Docs: https://docs.nightly.app/docs/solana/solana/detection — Nightly exposes the
    // wallet-standard feature surface on window.nightly.solana.features directly.
    for (const f of ["standard:connect", "standard:disconnect", "solana:signTransaction", "solana:signAndSendTransaction", "solana:signMessage"])
      log(`  ${f}: ${feats.includes(f) ? "present" : "MISSING"}`, feats.includes(f) ? "ok" : "warn");
    // Pre-connect publicKey is a 11111111… placeholder (spike run 1) — never display as address.
    const pk = provider.publicKey ? String(provider.publicKey).slice(0, 8) + "…" : "none";
    log(`pre-connect publicKey=${pk} (placeholder — ignore until connect)`, "warn");
    el("b-connect").disabled = false;
  } catch (e) { log(`detection error: ${e.message}`, "err"); }
};

// ---- 2. connect ---------------------------------------------------------
el("b-connect").onclick = async () => {
  try {
    // Doc: https://docs.nightly.app/docs/solana/solana/connect —
    // features['standard:connect'].connect({silent}) → { accounts: WalletAccount[] }.
    let res = null;
    if (provider.features?.["standard:connect"]) {
      res = await provider.features["standard:connect"].connect({ silent: false });
      account = res?.accounts?.[0] ?? null;
      log(`connected via features['standard:connect'] (${res?.accounts?.length ?? 0} accounts)`, "ok");
    } else {
      // Legacy fallback (proven in run 1): provider.connect() + provider.publicKey.
      await provider.connect();
      log("connected via legacy provider.connect()", "ok");
    }
    const addr = account?.address ?? String(provider.publicKey);
    if (!addr || addr.startsWith("11111111")) throw new Error("no real account address after connect");
    payer = new PublicKey(addr);
    // shim for legacy path: features['solana:signTransaction'] input requires an account object
    account = account ?? { address: payer.toBase58(), publicKey: payer.toBytes(), chains: [], features: [] };
    log(`address: ${payer.toBase58()}`, "ok");
    if (account) log(`account.features: ${account.features?.join(", ") ?? "(none listed)"}`);
    el("b-send").disabled = false;
  } catch (e) { log(`connect error: ${e.name ?? ""} ${e.message}`, "err"); }
};

// ---- 3. sign + send -----------------------------------------------------
el("b-send").onclick = async () => {
  try {
    const { blockhash, lastValidBlockHeight } = await conn.getLatestBlockhash();
    log(`blockhash ${blockhash.slice(0, 12)}… valid h=${lastValidBlockHeight}`);
    const tx = new Transaction({ feePayer: payer, blockhash, lastValidBlockHeight }).add(
      SystemProgram.transfer({ fromPubkey: payer, toPubkey: payer, lamports: 0 }),
      new TransactionInstruction({ programId: MEMO_PID, keys: [], data: new TextEncoder().encode("SPIKE") }),
    );
    // Run 2: Nightly keys signing features 'solana:*' (provider.features AND account.features);
    // docs' 'standard:' signing keys are absent (run 2 log). Resolve from account.features
    // first, provider fallback.
    // Optional probe: try features['solana:signAndSendTransaction'] once — docs demand a `chain`
    // id (Cookie Chain id unknown), so expect rejection; on any error fall back to
    // solana:signTransaction + sendRawTransaction. Which path wins is logged for README quirks.
    const feats = Object.keys(provider.features ?? {});
    const fromAccount = (account?.features ?? []).includes("solana:signTransaction") && feats.includes("solana:signTransaction");
    const signTx = fromAccount ? provider.features["solana:signTransaction"] : provider.features?.["solana:signTransaction"] ?? null;
    const signSend = feats.includes("solana:signAndSendTransaction") ? provider.features["solana:signAndSendTransaction"] : null;
    log(`resolved signing keys: signTransaction=${fromAccount ? "account.features" : feats.includes("solana:signTransaction") ? "provider.features" : "MISSING"}:solana:signTransaction` +
        (signSend ? ` / probe=provider.features:solana:signAndSendTransaction` : " / probe=unavailable"));
    if (!signTx && !feats.includes("solana:signTransaction")) throw new Error("features['solana:signTransaction'] missing — cannot sign");
    const serialized = tx.serialize({ requireAllSignatures: false, verifySignatures: false });
    const t0 = performance.now();
    let raw = null;
    let path = "signTransaction+sendRawTransaction";
    if (signSend) {
      try {
        const out = await signSend.signAndSendTransaction({ account, transaction: serialized });
        if (out?.signature) { signature = out.signature; path = "signAndSendTransaction (probe won)"; }
      } catch (probeErr) {
        log(`signAndSend probe rejected (${String(probeErr.message || probeErr).slice(0, 80)}) — falling back`, "warn");
      }
    }
    if (!signature) {
      const outs = await signTx.signTransaction({ account, transaction: serialized });
      raw = outs?.[0]?.signedTransaction;
      if (!raw) throw new Error("signTransaction returned no signedTransaction");
      signature = await conn.sendRawTransaction(raw, { skipPreflight: false });
      path = "signTransaction+sendRawTransaction";
    }
    log(`sent via ${path} in ${Math.round(performance.now() - t0)}ms — signature: ${signature}`, "ok");
    log(`explorer: https://cookiescan.io/tx/${signature}`);
    el("b-verify").disabled = false;
    poll();
  } catch (e) {
    log(`sign/send error: ${e.name ?? ""} ${e.message} ${e.data ? JSON.stringify(e.data) : ""}`, "err");
  }
};

// ---- confirmation polling (S1 gate: < 1s) -------------------------------
async function poll() {
  const t0 = performance.now();
  for (let i = 0; i < 30; i++) {
    const st = await conn.getSignatureStatuses([signature]);
    const s = st?.value?.[0];
    if (s && ["confirmed", "finalized"].includes(s.confirmationStatus)) {
      log(`confirmed ${s.confirmationStatus} in ${Math.round(performance.now() - t0)}ms, slot=${s.slot}`, "ok");
      return;
    }
    await new Promise(r => setTimeout(r, 200));
  }
  log("confirmation timeout (6s)", "err");
}

// ---- 4. verify memo via getTransaction ----------------------------------
el("b-verify").onclick = async () => {
  try {
    const txr = await conn.getTransaction(signature, { commitment: "confirmed", maxSupportedTransactionVersion: 0 });
    if (!txr) { log("getTransaction: not indexed yet — click again", "warn"); return; }
    const memoLog = txr.meta?.logMessages?.find(l => l.includes("SPIKE"));
    log(`getTransaction ok: slot=${txr.slot} fee=${txr.meta?.fee} lamports; memo: ${memoLog ?? "NOT FOUND"}`, memoLog ? "ok" : "err");
    log(`fortune_idx math: ${txr.slot} mod 64 = ${txr.slot % 64}`);
    log("VERDICT inputs collected — copy this log into spikes/001-nightly-connect/README.md", "ok");
  } catch (e) { log(`verify error: ${e.message}`, "err"); }
};
</script>
</body>
</html>
